name: multi-tenant-saas-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saas_platform_prod}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod_secure_password_98765}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres_prod_user} -d ${POSTGRES_DB:-saas_platform_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend_network

  redis:
    image: redis:7-alpine
    container_name: saas_redis_prod
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_backend_prod
    restart: always
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres_prod_user:prod_secure_password_98765@postgres:5432/saas_platform_prod?schema=public}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-saas_platform_prod}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod_secure_password_98765}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-prod_jwt_secret_key_87654321_secure}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend_network
      - frontend_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saas_frontend_prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend_network

networks:
  backend_network:
    driver: bridge
    internal: false
  frontend_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
