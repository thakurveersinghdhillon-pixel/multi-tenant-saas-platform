name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test & Build Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas_platform_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: super_secret_jwt_access_key_minimum_32_characters_long
      JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_minimum_32_characters_long
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Run Prisma Database Migrations & Seed RBAC
        working-directory: ./backend
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Run Unit Tests (19 suites, 146 tests)
        working-directory: ./backend
        run: npm run test

      - name: Run E2E Tests (12 suites, 168 tests)
        working-directory: ./backend
        run: npm run test:e2e

      - name: Build Backend Production Artifacts
        working-directory: ./backend
        run: npm run build

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  docker-build-check:
    name: Verify Production Docker Image Builds
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: saas-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: saas-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
